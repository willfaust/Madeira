name: MadeiraSSDProbe
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MadeiraSSDProbe:
    type: application
    platform: iOS
    sources:
      - App.swift
      - ../../../app/Madeira/SteamStorage.swift
      - SteamStorageProbe.swift
      - SteamStorageProbeView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.madeira.ssd-probe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Madeira SSD Probe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
schemes:
  MadeiraSSDProbe:
    build:
      targets:
        MadeiraSSDProbe: all
